  <title>55 Performance · Main C# Core</title>
  <style>
  *{box-sizing:border-box}body{margin:0;background:#081425;color:#edf9ff;font:14px/1.55 system-ui,sans-serif}
  .shell{max-width:710px;margin:auto;padding:15px 12px 36px}header{display:flex;align-items:center;gap:10px;margin-bottom:15px}
  .logo{display:grid;place-items:center;width:50px;height:50px;flex:none;font-weight:900;font-size:26px;border:1px solid #4effd7;border-radius:14px;color:#71f5da;background:#123f46}
  h1{font-size:20px;margin:0}h1 em{font-style:normal;color:#6ef4cf}small{font-size:9px;color:#91c1da}.tag{font-size:10px;background:#193a47;border:1px solid #4ce0d1;padding:6px;border-radius:20px;margin-left:auto;white-space:nowrap}
  .notice{border:1px solid #51d4c8;background:#123542;padding:12px;border-radius:15px}.notice p{margin:4px 0;color:#b9d2de}
  .panel{background:linear-gradient(140deg,#122c42,#121c34);border:1px solid #426b80;border-radius:16px;padding:15px;margin-top:12px;box-shadow:0 5px 18px #0003}
  h2{font-size:16px;margin:0 0 9px;color:#c6fff2}
  input{width:100%;background:#0e2232;border:1px solid #6184a7;border-radius:8px;color:#fff;padding:12px;margin:6px 0 10px;font:14px monospace}
  button{border:1px solid #66d9cc;background:#173d53;border-radius:9px;color:#fff;font-weight:700;padding:11px 13px}
  button.primary{background:#127a72}.value{font-weight:800;color:#f5e2a7;overflow-wrap:anywhere}
  .muted{font-size:12px;color:#aec7d5}.steps{display:flex;gap:6px;flex-wrap:wrap}
  .steps span{padding:5px;border:1px solid #4b7086;border-radius:7px;color:#e9faff;font-size:11px}
  code{display:block;word-break:break-all;background:#0b1c29;padding:8px;border-radius:8px;font-size:12px}
  footer{padding:12px 3px;color:#a4bacb;font-size:11px}
  </style>
