<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55 Flash Source Port</title><style>body{font:16px system-ui;background:#12151b;color:#f4f4f4;max-width:700px;margin:auto;padding:20px}button,input{font:inherit;margin:8px;padding:10px}button{background:#fa8b2a;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222;padding:12px;border-radius:8px}</style><h2>55 PERFORMANCE · Source Flash Audit</h2><p>ตรวจไฟล์ BIN และ checksum จากซอร์ส C# ต้นฉบับ — ไม่มีการส่งคำสั่งไป ECU</p><p><a style="color:#ff9a40" href="../index.html">กลับแอปเดิม</a> | <a style="color:#ff9a40" href="../55_FTDI_USB_TEST.html">ทดสอบสาย FTDI</a></p><input id="f" type="file" accept=".bin,application/octet-stream"><pre id="out">เลือก BIN เพื่อเริ่มตรวจ</pre><script type="module">import {checksum8BitHonda,validateHondaPacket,assertBinSize} from './honda-checksum.js';document.getElementById('f').onchange=async e=>{let f=e.target.files[0];if(!f)return;let b=new Uint8Array(await f.arrayBuffer());let r=assertBinSize(b);let hash=await crypto.subtle.digest('SHA-256',b);let hex=Array.from(new Uint8Array(hash),x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('out').textContent=JSON.stringify({name:f.name,bytes:r.bytes,sizeInKB:r.bytes/1024,knownFileSize:r.allowed,sha256:hex,checksum8BitHondaEntireFile:checksum8BitHonda(b),note:'File-size match does NOT establish ECU compatibility. This page does not flash ECU.'},null,2);};</script></html>
