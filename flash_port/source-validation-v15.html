<a href="../index.html" style="display:inline-flex;margin:12px 10px 12px 0">‹ กลับเมนูหลัก 55 PERFORMANCE</a>
<a href="flash-write-lab.html">← Flash Bench V15</a><h2>55 ECU C# Source Validation V16.1.1</h2>
<p>ทดสอบโค้ด/โปรไฟล์แบบออฟไลน์ ไม่ต่อ USB และไม่ส่ง ERASE/WRITE</p><b id="sum">กำลังทดสอบ...</b><pre id="out"></pre>
<script type="module">
import {loadCSharpCatalog,findCSharpEcuId} from './csharp-ecu-catalog.js?v=302';
import {csharpOffsetInference} from './csharp-offsets.js?v=305';
import {inspectCSharpEcuType,correctKeihinChecksum,correctShindengenChecksum,deriveShindengenWriteKey} from './csharp-logic.js';
import {createWriteFrame} from './flash-frames.js';
import {HondaFlashEngine} from './honda-write-engine.js?v=303';
import {hondaChecksum} from './ftdi-webusb.js';
import {SOURCE_SIZES,scanMainBinIds,findMainEcuPrefixInBin,sourceSums} from './main-bin-audit.js?v=1';
const checks=[];
async function t(name,fn){try{checks.push([name,!!(await fn())])}catch(e){checks.push([name,false,e.message])}}
const reply=v=>{const a=Uint8Array.from(v);a[a.length-1]=hondaChecksum(a.slice(0,-1));return {reply:a}};
function fake(id){return {ready:true,async initializeIso(){},async sendWake(){},async close(){this.ready=false},
async exchangeRaw(f){const b=Array.from(f);if(b[0]===114&&b.length===7)return reply([2,11,0,0,0,...id.match(/../g).map(x=>parseInt(x,16)),0]);
if((b[0]===125||b[0]===123)&&b.length===6&&b[3]===1)return reply([2,8,0,0,0,0,3,0]);
return reply([2,5,0,0,0])}}}
function shBin(){const b=new Uint8Array(262144);b.set([83,86,56,53,48],100);b.set([17,18,19,20,21,21,23],200);b.set([11,12,13,14,15,16],230);b.set([238,0],238);b.set([208,7],300);b.set([90,90,90,90],b.length-4);return b}
await t('C# catalog full 290 entries (Keihin 232 + Shindengen 58)',async()=>{
 const rows=await loadCSharpCatalog(),v=[...rows.values()];
 return rows.size===290&&v.filter(x=>x.family==='KEIHIN').length===232&&v.filter(x=>x.family==='SHINDENGEN').length===58&&v.filter(x=>!x.part).length===2;
});
await t('K03-H01 ID and offset 0x8000',async()=>{const v=await findCSharpEcuId('0101880D01');return v?.part==='38770-K03-H01'&&v.startOffset===32768});
await t('Shindengen ID maps to auto offset',async()=>{const v=await findCSharpEcuId('01046B0F01');return v?.family==='SHINDENGEN'&&v.startOffset===null});
await t('64KB auto offset but not auto family',()=>{const v=csharpOffsetInference(new Uint8Array(65536));return v.startOffset===32768&&v.csharpClassHint==='UNDETERMINED'});
await t('Keihin checksum on copy',()=>correctKeihinChecksum(Uint8Array.of(0,1,2,3),0).newByte===250);
await t('C# Keihin write-frame checksum',()=>{const b=createWriteFrame(new Uint8Array(128),{profile:'KEIHINOTHER',startOffset:32768});return b.length===139&&hondaChecksum(b)===0});
await t('C# blank-block pointer',()=>{const b=createWriteFrame(new Uint8Array(128),{profile:'KEIHINOTHER',startOffset:32768,nextBlockIndex:4});return b[134]===8&&b[135]===32});
await t('Shindengen BIN signature',()=>inspectCSharpEcuType(shBin()).type==='SHINDENGENV850');
await t('Shindengen checksum offset',()=>correctShindengenChecksum(shBin()).checksumOffset===296);
await t('Shindengen Seed/Key derived',()=>deriveShindengenWriteKey(shBin(),Uint8Array.of(18,52))?.length===2);
await t('Physical K03 ID read from mocked ECU',async()=>{const e=new HondaFlashEngine(fake('0101880D01'));return (await e.identify()).sourceMatched});
await t('K03 preflight correct',async()=>{const e=new HondaFlashEngine(fake('0101880D01'));await e.identify();return e.makePlan(new Uint8Array(65536),{filename:'K03-H01.bin'}).expectedBlockCount===512});
await t('Mismatched BIN part blocked',async()=>{const e=new HondaFlashEngine(fake('0101880D01'));await e.identify();try{e.makePlan(new Uint8Array(65536),{filename:'K2J-T01.bin'});return false}catch(x){return x.code==='PART_NOT_CONFIRMED'}});
await t('Unlisted ID blocked',async()=>{const e=new HondaFlashEngine(fake('FFFFFFFFFF'));await e.identify();try{e.makePlan(new Uint8Array(65536),{filename:'unknown.bin'});return false}catch(x){return x.code==='UNLISTED_ECU'}});
await t('Shindengen auto preflight',async()=>{const e=new HondaFlashEngine(fake('01046B0F01'));await e.identify();const p=e.makePlan(shBin(),{filename:'K2SA-N02.bin'});return p.startOffset===65536&&p.expectedBlockCount===1536});
await t('Post-write restart check reads the same ECU ID (mock)',async()=>{
 const e=new HondaFlashEngine(fake('0101880D01'));
 e.state='finished';e.identity={ecuId:'0101880D01'};e.lastResult={ok:true,ecuId:'0101880D01'};
 const r=await e.postFlashCheck();
 return r.postFlashEcuResponded===true&&r.idMatchesBeforeWrite===true&&r.readbackVerified===false&&r.flashCount===3;
});
await t('Post-write restart check rejects a changed ECU ID (mock)',async()=>{
 const e=new HondaFlashEngine(fake('FFFFFFFFFF'));
 e.state='finished';e.identity={ecuId:'0101880D01'};e.lastResult={ok:true,ecuId:'0101880D01'};
 try{await e.postFlashCheck();return false}catch(x){return x.code==='POST_FLASH_MISMATCH'&&e.state==='stopped'}
});

await t('Shindengen checksum exact C# ranges for 4 unaligned markers',()=>{
 for(let mod=0;mod<4;mod++){
  const b=new Uint8Array(262144),j=128+mod;
  b[0]=7;b[4]=17;b[b.length-11]=19;
  b.set([17,18,19,20,21,21,23],50);
  b.set([0xd0,0x07],j);
  b.set([90,90,90,90],b.length-4);
  const r=correctShindengenChecksum(b);
  if(r.checksumOffset!==(mod===2?j-10:j-4)||r.data===b||!r.modified)return false;
 }
 return true;
});
await t('C# 7-byte ECU ACK allows one explicitly requested block resend',async()=>{
 const e=new HondaFlashEngine({ready:true});let attempts=0,retries=0;
 e.onEvent=ev=>{if(ev.phase==='SOURCE_EXPLICIT_RETRY')retries++};
 e.x=async()=>++attempts===1?Uint8Array.of(2,7,0,0,0,0,0):Uint8Array.of(2,5,0,0,0);
 const count=await e.writeBlocks({bin:new Uint8Array(128),blockBytes:128,startOffset:0,profile:'KEIHINOTHER'});
 return attempts===2&&retries===1&&count===1;
});
await t('C# 7-byte explicit retry budget never exceeds two total',async()=>{
 const e=new HondaFlashEngine({ready:true});let attempts=0;
 e.x=async()=>{attempts++;return Uint8Array.of(2,7,0,0,0,0,0)};
 try{await e.writeBlocks({bin:new Uint8Array(128),blockBytes:128,startOffset:0,profile:'KEIHINOTHER'});return false}
 catch(err){return attempts===3&&err.code==='WRITE_REJECTED'}
});
await t('USB timeout never blindly resends flash block',async()=>{
 const e=new HondaFlashEngine({ready:true});let attempts=0;
 e.x=async()=>{attempts++;throw Error('hardware timeout')};
 try{await e.writeBlocks({bin:new Uint8Array(128),blockBytes:128,startOffset:0,profile:'KEIHINOTHER'});return false}
 catch(err){return attempts===1&&err.message==='hardware timeout'}
});

await t('C# WorkerThread confirms HELLO twice before ECU ID',async()=>{
 const e=new HondaFlashEngine(fake('0101880D01'));const labels=[],original=e.x.bind(e);
 e.x=async(...args)=>{labels.push(args[0]);return original(...args)};
 await e.identify();
 return labels.indexOf('HELLO')>=0&&labels.indexOf('CONFIRM_WORKER_SESSION')>labels.indexOf('HELLO')&&
        labels.indexOf('READ_ECU_ID')>labels.indexOf('CONFIRM_WORKER_SESSION');
});
await t('C# WorkerThread fallback poll reconfirms session before ECU ID',async()=>{
 const usb=fake('0101880D01'),physicalDevice={vendorId:0x0403};
 usb.lastDevice=physicalDevice;usb.openSelected=async()=>{usb.ready=true};
 const e=new HondaFlashEngine(usb),labels=[],original=e.x.bind(e);
 e.x=async(...args)=>{
   labels.push(args[0]);
   if(args[0]==='HELLO')throw Error('No HELLO response');
   return original(...args);
 };
 const identity=await e.identify();
 return identity.handshake==='KEIHIN_POLL'&&labels.includes('KEIHIN_FALLBACK_HELLO')&&
        labels.indexOf('CONFIRM_WORKER_SESSION')>labels.indexOf('KEIHIN_FALLBACK_HELLO')&&
        labels.indexOf('READ_ECU_ID')>labels.indexOf('CONFIRM_WORKER_SESSION');
});
await t('Main C# covers all 11 BIN size scanners',()=>SOURCE_SIZES.length===11&&SOURCE_SIZES[0]===32768&&SOURCE_SIZES.at(-1)===1048576);
await t('Source 64 KB 5-byte BIN ID marker',()=>{
 const b=new Uint8Array(65536);b.set(Uint8Array.of(1,1,136,13,1),9144);
 const ids=scanMainBinIds(b);
 return ids[0]?.id==='0101880D01'&&ids[0].idOffset===9144&&ids[0].fullId===true;
});
await t('Source 256 KB 3-byte BIN ID marker remains partial',()=>{
 const b=new Uint8Array(262144);b.set(Uint8Array.of(1,1,136),2048);
 const ids=scanMainBinIds(b);
 return ids[0]?.id==='010188'&&ids[0].fullId===false;
});
await t('Source ECU prefix search only matches first 3 bytes',()=>{
 const b=Uint8Array.of(0xff,0x01,0x01,0x88,0x00);
 const r=findMainEcuPrefixInBin(b,'0101880D01');
 return r.found&&r.offset===1&&r.prefix==='010188';
});
await t('C# Sum8 / Sum32 Little Endian / Honda complement',()=>{
 const b=Uint8Array.of(1,0,0,0,2,0,0,0);
 const r=sourceSums(b);
 return r.sum8===3&&r.sum32===3&&r.checksum8Honda===253;
});
await t('C# 256 KB M32R/RH850/MPC560 offset signatures',()=>{
 for(const tail of [[255,255,255,170,170,170,170],[255,255,255,0,0,0,0],[255,255,255,255,255,255,255]]){
  const b=new Uint8Array(262144);b.set(tail,b.length-7);
  const a=csharpOffsetInference(b);if(a.startOffset!==0||a.checksumOffset!==0x3FFF8)return false;
 }
 return true;
});
await t('C# 512 KB MPC560 end signature',()=>{
 const b=new Uint8Array(524288);b.set([255,255,255,255,255,255,255],b.length-7);
 const a=csharpOffsetInference(b);return a.startOffset===0&&a.checksumOffset===0x7FFF8;
});
await t('C# 1024 KB SH705X / default checksum offsets',()=>{
 const b=new Uint8Array(1048576);
 const a=csharpOffsetInference(b);if(a.checksumOffset!==0x7FFF8)return false;
 b.set([255,255,255,170,170,170,170],b.length-7);
 return csharpOffsetInference(b).checksumOffset===0xFFFF8;
});
await t('C# 128 KB offset out of range is flagged',()=>{
 const a=csharpOffsetInference(new Uint8Array(131072));
 return a.startOffset>=131072&&a.warnings.some(x=>x.includes('exceeds BIN length'));
});
const passed=checks.filter(x=>x[1]).length;document.getElementById('sum').textContent=passed+'/'+checks.length+' PASS (offline only)';
document.getElementById('sum').style.color=passed===checks.length?'#7aebb0':'#ffa09b';
document.getElementById('out').textContent=checks.map(x=>(x[1]?'PASS':'FAIL')+' — '+x[0]+(x[2]?' '+x[2]:'')).join('\n');
</script></html>
