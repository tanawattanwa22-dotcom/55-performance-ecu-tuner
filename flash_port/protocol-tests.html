<main><h2>55 ECU · ตรวจโปรโตคอลแบบไม่ต่อรถ</h2><p>ตรวจ Checksum และกรอบข้อมูลด้วยชุดทดสอบอัตโนมัติ ไม่ส่งคำสั่ง USB/ECU</p><pre id="out">กำลังทดสอบ...</pre><a href="../index.html">กลับโปรแกรมจูน</a></main><script type="module">
import {checksumHonda,validateHonda,makeHondaFrame,inspectHondaReply,validateBinFile} from './protocol-core.js';
const checks=[
 ['checksum known vector',checksumHonda([0x72,0x05,0x00,0xF0])===0x99],
 ['checksum frame valid',validateHonda(makeHondaFrame([0x72,0x05,0x00,0xF0]))],
 ['checksum corruption rejected',!validateHonda([0x72,0x05,0x00,0xF0,0x98])],
 ['reply accepts valid frame',inspectHondaReply(makeHondaFrame([0x02,0x04,0x01])).ok],
 ['reply rejects bad length',!inspectHondaReply([0x02,0x05,0x01,0xF9]).ok],
 ['BIN exact size',validateBinFile(new Uint8Array(262144),262144).ok],
 ['BIN wrong size rejected',!validateBinFile(new Uint8Array(262144),393216).ok],
 ['BIN missing profile rejected',!validateBinFile(new Uint8Array(262144),null).ok],
];
document.getElementById('out').textContent=checks.map(([n,ok])=>(ok?'PASS':'FAIL')+' — '+n).join('\n')+'\n\n'+checks.filter(x=>x[1]).length+'/'+checks.length+' ผ่าน';
</script></html>
