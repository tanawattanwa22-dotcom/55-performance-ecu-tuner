name: Generate Android PWA icon sizes
on:
  push:
    branches: [main]
    paths:
      - 'icons/55-home-source.jpg'
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user Pillow
      - name: Generate 55 Performance icon sizes from approved artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('icons')
          from PIL import ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          data=(root/'55-home-source.jpg').read_bytes()
          print('source bytes:',len(data),'header:',data[:24].hex(),'end:',data[-8:].hex(),flush=True)
          anchors={0:'ffd8ffe000104a464946',128:'e1e1e1e1e1e1e1e1e1e1',256:'e12324526293b1f04454',384:'cf85292cece6e4935d14',512:'bd73f3b9e9533ebbd855',640:'8068369d9a45b900574d',768:'c9634a69b04bd4ca2cca',896:'b11ef152062e46b52d4c',1024:'d2fb8e46b7139791b480',1152:'eea992ed90b922d64fc1',1280:'a5f897c683c4cbec687a',1408:'e57bcd57a664fb94ef35',1536:'d483ec57bcd5fa6e4fb9',1664:'0af3de658e00008e00e5',1792:'b99d39231fc2bce8c163',1920:'65b733a9aaa4e651a2b1',2048:'f294208dc67344116291',2176:'c61e46d4dea9f08aeb69',2304:'8d1db39934523af4adfa',2432:'7f5878d633a738c1ff00',2560:'4ac56e2fd3fe74a983c6',2688:'48db105ae234001636d6',2816:'7bdac14d06eb62722f75',2944:'57efac5ab4b13329616b',3072:'600aded7cb7dbc29aae9',3200:'1130fb57efaa79a49059',3328:'ae19431dcabdbc29c695',3456:'568d3952d172da2b2296',3584:'310eb121890dc9f688ff',3712:'9ffa97e5153d253f55f9',3840:'64d9ffd9'}
          for pos,hx in anchors.items():
              a=data.find(bytes.fromhex(hx))
              print('anchor',pos,a,'shift',pos-a if a>=0 else '?',flush=True)

          source=Image.open(root/'55-home-source.jpg').convert('RGB')
          def export(name,size,maskable=False):
              if maskable:
                  # Android maskable icons keep the center 80% safe.
                  canvas=Image.new('RGB',(size,size),'#06152a')
                  inner=int(size*.78)
                  image=source.resize((inner,inner),Image.Resampling.LANCZOS)
                  canvas.paste(image,((size-inner)//2,(size-inner)//2))
                  im=canvas
              else:
                  im=source.resize((size,size),Image.Resampling.LANCZOS)
              im.save(root/name,'PNG',optimize=True)
          export('icon-192.png',192)
          export('icon-512.png',512)
          export('icon-maskable-512.png',512,maskable=True)
          export('apple-touch-icon.png',180)
          export('favicon-64.png',64)
          print('Generated 5 PWA icons from 55-home-source.jpg')
          PY
      - name: Commit PNG icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png icons/apple-touch-icon.png icons/favicon-64.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate branded PWA icons from approved 55 PERFORMANCE artwork"
            git push
          fi
