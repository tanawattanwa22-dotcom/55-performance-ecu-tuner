name: Generate Android PWA icon sizes
on:
  push:
    branches: [main]
    paths:
      - 'icons/55-home-source.jpg'
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user Pillow
      - name: Generate 55 Performance icon sizes from approved artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('icons')
          from PIL import ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          data=(root/'55-home-source.jpg').read_bytes()
          print('source bytes:',len(data),'header:',data[:24].hex(),'end:',data[-8:].hex(),flush=True)
          # The first binary upload had nine missing header bytes; restore
          # them from the exact approved JPG prefix before creating icons.
          import base64, hashlib
          import zlib
          prefix=zlib.decompress(base64.b64decode('eNr7f+P/AwYBLzdPNwZGRgYGRiBk+H+bwZlBRVJaQVpcRUFOQVNdRdss2trMyMgs3z/EKbqlpKujsaS+duLiixsnzjo6t7Z+2/cdR2/ce/XmVe/6////Pf5/8emrhyBDGNU1Nc0MzLKtrbMfTquf9pBk8P8AgyAHwwKGBcyMSgxMgozMgoz/jzBIMTAwMYNcCwfMLAyMTKxsQDk7AQYmRiYWZmYODjZGVpAcIxMzgyCLkKKhsGNg4sSDrCKiSkaFRZNMnJyDGxdeBAD76Wn4'))
          assert len(prefix)==256,('Unexpected source prefix length',len(prefix))
          if len(data)==3835:
              data=prefix+data[247:]
              (root/'55-home-source.jpg').write_bytes(data)
          expected_sha='31103b7b90722e2883f75b64aab47e6189127d3e'
          git_sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          assert git_sha==expected_sha,('Artwork failed integrity check',len(data),git_sha)
          print('Source JPG passed exact Git object hash and image validation',len(data),flush=True)
          source=Image.open(root/'55-home-source.jpg').convert('RGB')
          def export(name,size,maskable=False):
              if maskable:
                  # Android maskable icons keep the center 80% safe.
                  canvas=Image.new('RGB',(size,size),'#06152a')
                  inner=int(size*.78)
                  image=source.resize((inner,inner),Image.Resampling.LANCZOS)
                  canvas.paste(image,((size-inner)//2,(size-inner)//2))
                  im=canvas
              else:
                  im=source.resize((size,size),Image.Resampling.LANCZOS)
              im.save(root/name,'PNG',optimize=True)
          export('icon-192.png',192)
          export('icon-512.png',512)
          export('icon-maskable-512.png',512,maskable=True)
          export('apple-touch-icon.png',180)
          export('favicon-64.png',64)
          print('Generated 5 PWA icons from 55-home-source.jpg')
          PY
      - name: Commit PNG icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/55-home-source.jpg icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png icons/apple-touch-icon.png icons/favicon-64.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate branded PWA icons from approved 55 PERFORMANCE artwork"
            git push
          fi
