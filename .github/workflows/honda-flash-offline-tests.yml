name: Honda C# Flash Port — Offline Validation

on:
  push:
    branches: [main]
    paths:
      - "flash_port/**"
      - "ui/**"
      - "index.html"
      - "tools/verify-ui-v19.mjs"
      - "tools/verify-main-neon-v25.mjs"
      - "tools/verify-honda-flash.mjs"
      - "tools/verify-preflight-afr-v24.mjs"
      - "tools/verify-main-programming-probe.mjs"
      - "tools/verify-main-full-flash-sim.mjs"
      - "tools/verify-offline-flash.mjs"
      - "tools/verify-main-diagnostic.mjs"
      - "tools/verify-shared-operations.mjs"
      - "tools/verify-main-auto-group.mjs"
      - "tools/verify-main-bin-sizes.mjs"
      - "tools/verify-original-ecm-reference.mjs"
      - "tools/verify-main-bin-analyze-result.mjs"
      - "tools/verify-main-bin-lock-export.mjs"
      - "tools/verify-source-flash-progress.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/honda-flash-offline-tests.yml"
  pull_request:
    paths:
      - "flash_port/**"
      - "ui/**"
      - "index.html"
      - "tools/verify-preflight-afr-v24.mjs"
      - "tools/verify-honda-flash.mjs"
      - "tools/verify-main-programming-probe.mjs"
      - "tools/verify-main-diagnostic.mjs"
      - "tools/verify-shared-operations.mjs"
      - "tools/verify-original-ecm-reference.mjs"
      - "tools/verify-main-bin-analyze-result.mjs"
      - "tools/verify-main-bin-lock-export.mjs"
      - "tools/verify-source-flash-progress.mjs"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-parity:
    name: Source parity and failure-stop checks (NO ECU)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Regression: Main FormMain source parity for unlisted ECU, HELLO and DAT (NO USB)"
        run: node tests/main-source-parity.test.mjs
      - name: Verify original developer ECM.dat 122-row snapshot / PCX160 ABS read-only metadata
        run: node tools/verify-original-ecm-reference.mjs
      - name: Verify read-only Analyze Complete/Analyze Result with source BIN fixtures
        run: node tools/verify-main-bin-analyze-result.mjs
      - name: Verify Keihin Main C# Lock Read and Lock Mode BIN copy exports
        run: node tools/verify-main-bin-lock-export.mjs
      - name: Verify real Main source 10-second countdown and ACK-derived Flash progress UI
        run: node tools/verify-source-flash-progress.mjs
      - name: Verify read-only Main programming probe, timeout recovery and DAT trust (NO ECU)
        run: node tools/verify-main-programming-probe.mjs
      - name: Verify V28 signed Offline Flash and shared original source engine
        run: node tools/verify-offline-flash.mjs
      - name: Full source-based Keihin/Shindengen erase/write/recovery simulation (NO USB)
        run: node tools/verify-main-full-flash-sim.mjs
      - name: Run 29 offline/mock Honda flash checks
        run: node tools/verify-honda-flash.mjs
      - name: Verify Main C# PartID_ECU data-port round trip
        run: node tools/verify-main-source-manager.mjs
      - name: Verify three purchased C# diagnostic profiles and safe frames
        run: node tools/verify-main-diagnostic.mjs
      - name: Verify C# ACG/ECU password-protected format without publishing secrets
        run: node tools/verify-main-legacy-converter.mjs
      - name: Verify C# DTC six-memory read parsing
        run: node tools/verify-main-dtc.mjs
      - name: Verify one shared DTC source clear path and exclusive FT232R port
        run: node tools/verify-shared-operations.mjs
      - name: Validate V19 mobile category UI, pages and script syntax
        run: node tools/verify-ui-v19.mjs
      - name: Verify saved BIN snapshot and mobile customer flash handoff
        run: node tools/verify-tune-bin-flow.mjs
      - name: Verify V24 read-only ECU Preflight and Wideband-only AFR sensor
        run: node tools/verify-preflight-afr-v24.mjs
      - name: Verify Neon Main C# V25 groups, FT232R read-only framing and no ADX
        run: node tools/verify-main-neon-v25.mjs
      - name: Verify source Main C# auto-group selection and fail-stop
        run: node tools/verify-main-auto-group.mjs
      - name: Verify Main C# 384KB BIN ID / source sizes without ECU
        run: node tools/verify-main-bin-sizes.mjs
      - name: Check original FormMain BIN reader on all 11 sizes, source match order and 56KB overwrite
        run: node tests/main-bin-file-parity.test.mjs
