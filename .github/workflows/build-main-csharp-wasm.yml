name: Build Main C# WebAssembly sidecar (keep existing Flash unchanged)
on:
  push:
    branches: [main]
    paths:
      - 'csharp-core/**'
      - '.github/workflows/build-main-csharp-wasm.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-csharp-runtime
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Main.zip C# source parity offline tests
        run: dotnet run -c Release --project csharp-core/tests/CSharpCoreTests.csproj
      - name: Compile source C# to browser WebAssembly
        run: dotnet publish csharp-core/CSharpCoreBrowser.csproj -c Release -o "$RUNNER_TEMP/wasm-publish"
      - name: Publish C# runtime safely from latest main (skip outdated builds)
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/wasm-publish/wwwroot/_framework/blazor.webassembly.js"
          test -f "$RUNNER_TEMP/wasm-publish/wwwroot/index.html"
          git fetch origin main
          # A prior build may have published another hashed WASM asset while
          # this compile was running. Never rebase compiled binary assets.
          # A stale build must never overwrite newer source code's runtime.
          if ! git diff --quiet "$SOURCE_COMMIT" origin/main -- csharp-core; then
            echo "Source changed since this build. Newer workflow will publish."
            exit 0
          fi
          git reset --hard origin/main
          test -f index.html
          test -f flash_port/honda-write-engine.js
          test -f flash_port/ftdi-webusb.js
          rm -rf main-csharp-runtime
          mkdir -p main-csharp-runtime
          cp -a "$RUNNER_TEMP/wasm-publish/wwwroot/." main-csharp-runtime/
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main-csharp-runtime .nojekyll
          if git diff --cached --quiet; then
            echo "Runtime already current"
            exit 0
          fi
          git commit -m "build(csharp): publish source-parity WebAssembly runtime [skip ci]"
          git push origin HEAD:main
