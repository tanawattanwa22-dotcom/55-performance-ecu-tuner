name: Build Main C# WebAssembly sidecar (keep existing Flash unchanged)
on:
  push:
    branches: [main]
    paths:
      - 'csharp-core/**'
      - '.github/workflows/build-main-csharp-wasm.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-csharp-runtime
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Main.zip C# source parity offline tests
        run: dotnet run -c Release --project csharp-core/tests/CSharpCoreTests.csproj
      - name: Compile source C# to browser WebAssembly
        run: dotnet publish csharp-core/CSharpCoreBrowser.csproj -c Release -o "$RUNNER_TEMP/wasm-publish"
      - name: Stage only the C# sub-app, preserving existing web and ECU engine
        run: |
          test -f "$RUNNER_TEMP/wasm-publish/wwwroot/_framework/blazor.webassembly.js"
          rm -rf main-csharp-runtime
          mkdir -p main-csharp-runtime
          cp -a "$RUNNER_TEMP/wasm-publish/wwwroot/." main-csharp-runtime/
          # Required for _framework to be served intact on branch-based Pages.
          touch .nojekyll
          test -f index.html
          test -f flash_port/honda-write-engine.js
          test -f flash_port/ftdi-webusb.js
      - name: Commit compiled C# static runtime to existing Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main-csharp-runtime .nojekyll
          if git diff --cached --quiet; then
            echo 'C# runtime already current'
            exit 0
          fi
          git commit -m "build(csharp): publish isolated browser WASM runtime [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
