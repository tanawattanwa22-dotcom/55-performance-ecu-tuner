name: Verify Main C# ECU Data port
on:
  push:
    branches: [main]
    paths:
      - "flash_port/ecu-dat-editor.js"
      - "flash_port/main-source-manager.js"
      - "flash_port/main-source-manager.html"
      - "tools/verify-main-source-manager.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check flash_port/ecu-dat-editor.js
      - run: node --check flash_port/main-source-manager.js
      - run: node tools/verify-main-source-manager.mjs
