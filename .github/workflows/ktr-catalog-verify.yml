name: 55 Performance — ECM Catalog Integrity

on:
  push:
    branches: [main]
    paths:
      - "ktr/**"
      - "ecm/**"
      - "tools/verify-ktr-catalog.mjs"
      - "tools/verify-55-performance-brand.mjs"
      - ".github/workflows/ktr-catalog-verify.yml"
  pull_request:
    paths:
      - "ktr/**"
      - "ecm/**"
      - "tools/verify-ktr-catalog.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    name: Verify 55 Performance 152-row ECM data (NO ECU)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ECM reference records (original IDs intact)
        run: node tools/verify-ktr-catalog.mjs
      - name: Verify 55 Performance UI branding without changing ECM lookup IDs
        run: node tools/verify-55-performance-brand.mjs
