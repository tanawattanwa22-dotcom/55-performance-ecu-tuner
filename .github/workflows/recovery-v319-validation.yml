name: 55 PERFORMANCE Recovery V35 — native menu and Auto Offset

on:
  pull_request:
    paths:
      - "flash_port/**"
      - "tools/verify-honda-flash.mjs"
      - "tools/verify-main-full-flash-sim.mjs"
      - "ui/neon-v20.js"
      - "ui/neon-recovery-v35.js"
      - "ui/neon-preflight-v24.js"
      - "tools/verify-recovery-auto.mjs"
      - "ui/shared-operations-v30.js"
      - "index.html"
      - "tools/verify-recovery-menu.mjs"
      - ".github/workflows/recovery-v319-validation.yml"
  push:
    branches: [main]
    paths:
      - "flash_port/**"
      - "tools/verify-honda-flash.mjs"
      - "tools/verify-main-full-flash-sim.mjs"
      - "ui/neon-v20.js"
      - "ui/neon-recovery-v35.js"
      - "ui/neon-preflight-v24.js"
      - "tools/verify-recovery-auto.mjs"
      - "ui/shared-operations-v30.js"
      - "index.html"
      - "tools/verify-recovery-menu.mjs"
      - ".github/workflows/recovery-v319-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse recovery engine and panel scripts
        run: |
          node --check flash_port/honda-write-engine.js
          node --check flash_port/csharp-logic.js
          node --check ui/neon-recovery-v35.js
      - name: Verify native Recovery menu, auto ECU ID and script syntax
        run: node tools/verify-recovery-menu.mjs
      - name: Verify normal Flash one-tap, automatic Preflight and boot-ID write guard
        run: node tools/verify-recovery-auto.mjs
      - name: Reproduce Main C# Keihin / Shindengen source frames and recovery preflight
        run: node tools/verify-honda-flash.mjs
      - name: Test full mock ERASE WRITE Recovery ordering and fail-stop
        run: node tools/verify-main-full-flash-sim.mjs
